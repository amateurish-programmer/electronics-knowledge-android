name: Android CI
on:
  push:
    branches: ["feat/android-knowledge-v1", "main"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm test
      - run: npm run content:validate
      - name: Prove Gradle owns content generation
        run: |
          rm -rf app/src/main/assets
          gradle test lint assembleDebug --stacktrace
          test -f app/src/main/assets/content-bundle.json
          test -f app/src/main/assets/content/images/passive.svg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
