name: Release APK
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm test && npm run content:validate && npm run content:compile
      - name: Decode signing key
        env:
          KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
        run: echo "$KEYSTORE_B64" | base64 --decode > app/release.jks
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: release.jks
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: gradle test lint assembleRelease
      - run: sha256sum app/build/outputs/apk/release/*.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            SHA256SUMS.txt
